# Builds standalone binaries + npm package, attaches GitHub Release assets,
# updates Formula/anomalia.rb, and publishes to npm when credentials are present.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

      - name: Sync package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); p.version=process.argv[1]; fs.writeFileSync('package.json', JSON.stringify(p,null,2)+'\n');" "$TAG"
          sed -i "s/\.version('[^']*')/.version('${TAG}')/" cli.ts

      # Cross-compiles all four targets; names must stay `anomalia-<platform>` because
      # install.sh and `anomalia update` both build that URL. Also writes .tar.gz for Homebrew.
      - run: bun run build:all
      - run: bun run build:npm

      - name: Checksums
        working-directory: dist
        run: sha256sum anomalia-* > SHA256SUMS.txt

      - name: Update Homebrew formula
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/update-homebrew-formula.sh
          scripts/update-homebrew-formula.sh "${GITHUB_REF_NAME#v}"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/anomalia-*
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Commit Homebrew formula bump to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp Formula/anomalia.rb /tmp/anomalia.rb
          git fetch origin main
          git checkout -B homebrew-formula-bump origin/main
          mkdir -p Formula
          cp /tmp/anomalia.rb Formula/anomalia.rb
          if git diff --quiet Formula/anomalia.rb; then
            echo "Formula unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/anomalia.rb
          git commit -m "chore: bump Homebrew formula to ${GITHUB_REF_NAME}"
          git push origin homebrew-formula-bump:main

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dist-npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret not set — skipping npm publish."
            echo "Add an npm Access Token as repo secret NPM_TOKEN to enable publishing."
            exit 0
          fi
          npm publish --access public
